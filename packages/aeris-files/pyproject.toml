[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeris-files"
version = "0.4.0"
description = "Group folders on your desktop and render what is in them — images, video, Markdown, code — inside the panel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aeris-core>=0.3"]

[project.entry-points."aeris.modules"]
files = "aeris_files:MODULE"

[project.urls]
Homepage = "https://github.com/TheManishCode/AERIS"

[tool.hatch.build.targets.wheel]
packages = ["src/aeris_files"]
