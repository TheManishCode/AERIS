# Palisade — desktop fences for Wayland.
#
# This file is yours. Palisade reads it and never rewrites it, so your comments
# and layout survive. What you have *open* is kept separately in
# $XDG_STATE_HOME/palisade/state.json.
#
# Save the file and everything reloads live — no restart.
# Validate without touching the daemon:  palisade check

[settings]
# Which compositor layer tabs sit on.
#   bottom  = above the wallpaper, below your windows  (desktop furniture)
#   top     = above windows, below fullscreen
#   overlay = above everything
layer = "bottom"

# Ask the compositor to blur behind tabs. On Hyprland this is real blur of
# whatever is actually behind, updated live — not a wallpaper snapshot.
blur = true

corner_radius = 18   # matches Hyprland decoration.rounding

# Padding rhythm.
#   desktop = 10 at the panel, 5 at the card — the quickshell rice's own
#             spacing, so a panel sits in the same rhythm as the shell panels
#             beside it
#   compact = 8 and 4, tighter; suits a smaller corner_radius
#
# Everything inside the panel is derived from corner_radius by subtracting
# this padding at each step, so the curves nest. A docked panel always insets
# by 6: it is furniture in a narrow column, and more would cost width the
# window titles need.
spacing = "desktop"
font_scale = 1.0
show_item_count = true

# Re-colour from the wallpaper's Material You palette whenever it changes.
follow_material_you = true


# ===========================================================================
# GROUPS — the catalogue of things a tab can show.
#
# Defining a group puts NOTHING on screen. It is a menu entry.
#
#   SUPER + ALT + T   open the picker, choose a group, get a tab
#
# Open as many tabs as you like, including several of the same group. Tabs
# remember where you dragged them and come back after a restart.
#
# source.type — each kind comes from a module, so what you can use depends on
# what you have installed. `palisade doctor` lists them.
#   directory — mirror one folder                       (palisade-files)
#   paths     — a fixed, pinned list                    (palisade-files)
#   query     — a saved search; a live filtered view    (palisade-files)
#   windows   — the windows you have minimized          (palisade-dock)
#   apps      — every installed application             (palisade-apps)
#
# A kind whose package is not installed does not fail quietly: the panel says
# which package to install.
# ===========================================================================

[[group]]
id = "desktop"
title = "Desktop"
icon = "user-desktop"
source = { type = "directory", path = "~/Desktop", depth = 1 }

[[group]]
id = "downloads"
title = "Downloads"
icon = "folder-download"
sort = "mtime"          # newest first
source = { type = "directory", path = "~/Downloads", depth = 1 }

[[group]]
id = "documents"
title = "Documents"
icon = "folder-documents"
source = { type = "directory", path = "~/Documents", depth = 1 }

# A query group: documents touched recently, wherever they live. Nothing is
# moved or copied — this is a view, not a bucket.
[[group]]
id = "recent"
title = "Recent documents"
icon = "document-open-recent"
view = "list"
sort = "mtime"
width = 640
height = 320
source = { type = "query", roots = [
    "~/Documents",
    "~/Downloads",
], categories = ["document"], newer_than_days = 14, depth = 3, limit = 60 }

# Screenshots and images from the last month, as a contact sheet.
[[group]]
id = "pictures"
title = "Recent images"
icon = "folder-pictures"
icon_size = 64
source = { type = "query", roots = [
    "~/Pictures",
    "~/Downloads",
], categories = ["image"], newer_than_days = 30, depth = 3, limit = 80 }

# Minimized windows, as a taskbar you can click a specific window out of.
# Hyprland has no minimize; this pairs with ~/.config/hypr/custom/minimize.lua.
#   SUPER + ALT + N  minimize    CTRL + SUPER + N  restore last
[[group]]
id = "minimized"
title = "Minimized"
icon = "view-restore"
layer = "overlay"       # a taskbar you cannot see is not a taskbar
# Dock against the right edge and reserve the column, so opening the taskbar
# pushes your tiled windows aside instead of covering them. Picking a window
# out of a list that is hiding those windows is the one thing a taskbar must
# not do. `width` below is how wide that column is.
dock = "right"
view = "list"
sort = "mtime"          # most recently minimized first
# Behave as a picker: take the keyboard while open, preselect the first
# row, and close again once a window has been chosen (or on Esc, or on
# click-away). Without this the tab opens but ignores 1-9 and sits there
# after you have picked. A picker tab is also not restored at login — a
# taskbar you never asked for, holding the keyboard, is not a greeting.
picker = true
icon_size = 24
width = 420
height = 280
source = { type = "windows" }


# ---------------------------------------------------------------------------
# Want something always on screen without opening it by hand? A [[fence]] is a
# group that is placed in the config rather than spawned from the picker. None
# are defined by default — the desktop starts empty on purpose.
#
# [[fence]]
# title = "Downloads"
# x = 48
# y = 64
# source = { type = "directory", path = "~/Downloads" }
# ---------------------------------------------------------------------------
