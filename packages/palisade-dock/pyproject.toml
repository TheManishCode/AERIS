[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palisade-dock"
version = "0.4.0"
description = "Minimized applications for Palisade: a real minimize for Hyprland, and a taskbar to get windows back."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["palisade-core>=0.3"]

[project.entry-points."palisade.modules"]
dock = "palisade_dock:MODULE"

[project.urls]
Homepage = "https://github.com/PALISADE_OWNER/palisade-dock"

[tool.hatch.build.targets.wheel]
packages = ["src/palisade_dock"]

# The compositor-side half of the engine. Shipped inside the wheel so a plain
# `pip install palisade-dock` can place it with
# `python3 -m palisade_dock install-engine`; without it the taskbar installs
# fine and is permanently empty.
artifacts = ["src/palisade_dock/hypr/minimize.lua"]
