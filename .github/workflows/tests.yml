name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      # One red package should not hide the state of the other three.
      fail-fast: false
      matrix:
        package: [aeris-core, aeris-files, aeris-dock, aeris-apps]

    steps:
      - uses: actions/checkout@v4

      # PyGObject and GTK are system libraries, not wheels. poppler and
      # gtksourceview are optional at runtime and installed here on purpose:
      # CI is the one place that should exercise the paths a developer
      # machine may not have. xvfb because a few tests build a real widget,
      # and constructing one without a display segfaults rather than failing.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-gtksource-4 gir1.2-poppler-0.18 \
            xvfb libgtk-4-dev meson ninja-build valac \
            gobject-introspection libgirepository1.0-dev

      # Not packaged for 24.04 and there is no PPA worth trusting, so it is
      # built. Pinned rather than tracking main: a compositor protocol
      # library changing under CI turns an unrelated red build into an
      # afternoon. v1.1.1 is the oldest release that works with the GTK 4.14
      # in 24.04, so it is also the floor this project supports.
      - name: Build gtk4-layer-shell v1.1.1
        run: |
          git clone --depth 1 --branch v1.1.1 \
            https://github.com/wmww/gtk4-layer-shell .layer-shell
          cd .layer-shell
          meson setup --prefix /usr build -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      # A module is tested against core *from this checkout*, not against
      # whatever pip would resolve — a change that breaks a module should
      # fail here, in the pull request that made it.
      - name: Tests
        run: xvfb-run -a python3 -m pytest tests -q
        working-directory: packages/${{ matrix.package }}
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/aeris-core/src

      # The suite must also survive having no display at all: a test that
      # builds a widget without one segfaults, taking every result with it.
      # `tests/test_headless.py` asserts this from the inside; this runs it
      # from the outside, where an exit code is the whole answer.
      - name: Tests without a display
        run: python3 -m pytest tests -q
        working-directory: packages/${{ matrix.package }}
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
          PYTHONPATH: ${{ github.workspace }}/packages/aeris-core/src

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Nothing type-checks shell, and the one path that matters —
      # `curl ... | bash` on a machine that is not a developer's — is the
      # path nobody runs by hand. A parse error there is a silent install.
      - name: Installers and launcher parse
        run: |
          for script in packages/*/install.sh packages/aeris-core/bin/aeris \
                        tools/*.sh; do
            [ -e "$script" ] || continue
            bash -n "$script"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning packages/*/install.sh \
            packages/aeris-core/bin/aeris tools/*.sh
